server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${APP_NAME:e-etatcivil}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/etatcivil}
    username: ${DB_USERNAME:etatcivil}
    password: ${DB_PASSWORD:etatcivil}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${HIBERNATE_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025} # ex: MailHog/Mailtrap en dev, à remplacer en prod
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-a-real-env-min-32-chars-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  upload-dir: ${UPLOAD_DIR:uploads}
  actes-dir: ${ACTES_DIR:actes}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}