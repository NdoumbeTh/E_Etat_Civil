server:
  port: 8080

spring:
  application:
    name: e-etatcivil
  datasource:
    url: jdbc:postgresql://localhost:5432/etatcivil
    username: etatcivil
    password: etatcivil
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: localhost
    port: 1025 # ex: MailHog/Mailtrap en dev, à remplacer en prod
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: change-this-secret-in-a-real-env-min-32-chars-long
    expiration-ms: 86400000 # 24h
  upload-dir: uploads