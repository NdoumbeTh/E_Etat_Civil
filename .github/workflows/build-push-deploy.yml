name: CI/CD - Build, push vers ACR et déploiement sur AKS

# Se déclenche à chaque push sur main, ou à la demande depuis l'onglet Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: eetatcivilacr
  ACR_LOGIN_SERVER: eetatcivilacr.azurecr.io
  RESOURCE_GROUP: e-etat-civil-rg
  CLUSTER_NAME: e-etat-civil-cluster
  # Le tag de l'image est le numéro du commit : chaque version a une étiquette unique
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Premier job : construire les images et les publier dans l'ACR
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connexion à ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build et push backend
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/etatcivil-backend:${{ env.IMAGE_TAG }} ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/etatcivil-backend:${{ env.IMAGE_TAG }}

      - name: Build et push frontend
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/etatcivil-frontend:${{ env.IMAGE_TAG }} ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/etatcivil-frontend:${{ env.IMAGE_TAG }}

  # Second job : mettre à jour le cluster avec les nouvelles images
  # Il ne démarre que si le premier job a réussi
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Donne à kubectl l'adresse et les clés du cluster
      - name: Connexion au cluster AKS
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }} --overwrite-existing

      # Remplace l'image de chaque déploiement par la nouvelle version
      - name: Mise à jour des images
        run: |
          kubectl set image deployment/backend backend=${{ env.ACR_LOGIN_SERVER }}/etatcivil-backend:${{ env.IMAGE_TAG }}
          kubectl set image deployment/frontend frontend=${{ env.ACR_LOGIN_SERVER }}/etatcivil-frontend:${{ env.IMAGE_TAG }}

      # Attend que les nouveaux pods soient prêts, sinon le pipeline échoue
      - name: Vérification du déploiement
        run: |
          kubectl rollout status deployment/backend --timeout=300s
          kubectl rollout status deployment/frontend --timeout=300s
