apiVersion: v1
kind: ConfigMap
metadata:
  name: etatcivil-config
data:
  SERVER_PORT: "8080"
  APP_NAME: "e-etatcivil"
  DB_URL: "jdbc:postgresql://db:5432/etatcivil"
  DB_DRIVER: "org.postgresql.Driver"
  HIBERNATE_DDL_AUTO: "update"
  HIBERNATE_SHOW_SQL: "true"
  HIBERNATE_FORMAT_SQL: "true"
  HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  MAIL_HOST: "localhost"
  MAIL_PORT: "1025"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3"
  MAX_FILE_SIZE: "10MB"
  MAX_REQUEST_SIZE: "20MB"
  JWT_EXPIRATION_MS: "86400000"
  UPLOAD_DIR: "uploads"
  ACTES_DIR: "actes"
  CORS_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
  # Config pour le conteneur PostgreSQL lui-même
  POSTGRES_DB: "etatcivil"
