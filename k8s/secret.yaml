# Valeurs sensibles — À NE JAMAIS COMMITER avec de vraies valeurs en clair.
# Kubernetes attend du base64 (pas du chiffrement, juste de l'encodage) dans "data".
#
# Génère chaque valeur avec (cmd/PowerShell) :
#   echo -n "etatcivil_user" | openssl base64
# ou en PowerShell :
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("etatcivil_user"))
#
# Remplace les XXXXX ci-dessous par le résultat.

apiVersion: v1
kind: Secret
metadata:
  name: etatcivil-secret
type: Opaque
data:
  DB_USERNAME: XXXXX        # etatcivil_user encodé en base64
  DB_PASSWORD: XXXXX        # ton mot de passe DB encodé en base64
  POSTGRES_USER: XXXXX      # même valeur que DB_USERNAME
  POSTGRES_PASSWORD: XXXXX  # même valeur que DB_PASSWORD
  JWT_SECRET: XXXXX         # ton secret JWT (min 32 caractères) encodé en base64
